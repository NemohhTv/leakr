<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0A0A0A"/>
  <circle cx="90" cy="90" r="44" fill="#FF3C00">
    <animate attributeName="opacity" values="1;0.45;1" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="44;40;44" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="90" r="44" fill="none" stroke="#FF3C00" stroke-opacity="0.5" stroke-width="2">
    <animate attributeName="r" values="44;64;44" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
